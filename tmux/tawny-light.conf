# tawny light theme for tmux (includes status bar layout)
# For colors only, source tmux/tawny-light-colors.conf instead.
# generated from lua/tawny/palette.lua by scripts/generate_companion_themes.lua
# https://github.com/r-happy/tawny.nvim

# status bar base
set -g status-style                  "bg=#f3f1ec,fg=#51453d"
set -g status-left-length            50
set -g status-right-length           80

# status-left: [session name]
set -g status-left \
  "#[bg=#e9e3d8,fg=#2a221d,bold] #S #[bg=#f3f1ec,fg=#51453d,nobold] "

# status-right: [host] [date time]
set -g status-right \
  "#[bg=#e9e3d8,fg=#2a221d] #h #[bg=#51453d,fg=#fbfaf8] %Y-%m-%d  %H:%M "

# window list
set -g window-status-format \
  "#[bg=#f3f1ec,fg=#51453d] #{b:pane_current_path}  #I #W#F "

set -g window-status-current-format \
  "#[bg=#51453d,fg=#f3f1ec]#[bg=#51453d,fg=#fbfaf8,bold] #{b:pane_current_path} #[bg=#f0ede7,fg=#51453d]#[bg=#f0ede7,fg=#2a221d,bold] #I #W#F #[bg=#f3f1ec,fg=#f0ede7]"

set -g window-status-activity-style  "bg=#f3f1ec,fg=#7b5a0f"
set -g window-status-bell-style      "bg=#f3f1ec,fg=#992e29"

# pane borders
set -g pane-border-style             "fg=#c0baaf"
set -g pane-active-border-style      "fg=#7b5a0f"

# message / command prompt
set -g message-style                 "bg=#f0ede7,fg=#2a221d"
set -g message-command-style         "bg=#f0ede7,fg=#51453d"

# copy mode
set -g mode-style                    "bg=#e9e3d8,fg=#2a221d"
