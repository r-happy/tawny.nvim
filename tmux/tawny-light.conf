# tawny light theme for tmux (includes status bar layout)
# For colors only, source tmux/tawny-light-colors.conf instead.
# generated from lua/tawny/palette.lua by scripts/generate_companion_themes.lua
# https://github.com/r-happy/tawny.nvim

# status bar base: flat, text color only
set -g status-style                  "bg=#fbfaf8,fg=#51453d"
set -g status-left-length            50
set -g status-right-length           80

# status-left: [session name]
set -g status-left                   "#[fg=#84581f,bold] #S #[fg=#51453d,nobold] "

# status-right: [host] [date time]
set -g status-right                  "#[fg=#51453d]#h  %Y-%m-%d %H:%M "

# window list
set -g window-status-separator       ""
set -g window-status-format          "#[fg=#51453d,nobold] #{b:pane_current_path} #I #W#F "
set -g window-status-current-format  "#[fg=#2a221d,bold] #{b:pane_current_path} #I #W#F #[nobold]"

set -g window-status-activity-style  "bg=#fbfaf8,fg=#84581f"
set -g window-status-bell-style      "bg=#fbfaf8,fg=#992e29"

# pane borders
set -g pane-border-style             "fg=#c0baaf"
set -g pane-active-border-style      "fg=#84581f"

# message / command prompt
set -g message-style                 "bg=#f0ede7,fg=#2a221d"
set -g message-command-style         "bg=#f0ede7,fg=#51453d"

# copy mode
set -g mode-style                    "bg=#e9e3d8,fg=#2a221d"
