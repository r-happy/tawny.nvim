# tawny light theme for tmux (includes status bar layout)
# For colors only, source tmux/tawny-light-colors.conf instead.
# generated from lua/tawny/palette.lua by scripts/generate_companion_themes.lua
# https://github.com/r-happy/tawny.nvim

# status bar base
set -g status-style                  "bg=#f2f0ee,fg=#51453d"
set -g status-left-length            50
set -g status-right-length           80

# status-left: [session name]
set -g status-left \
  "#[bg=#dacfbe,fg=#1b1510,bold] #S #[bg=#f2f0ee,fg=#51453d,nobold] "

# status-right: [host] [date time]
set -g status-right \
  "#[bg=#dacfbe,fg=#1b1510] #h #[bg=#51453d,fg=#f9f8f6] %Y-%m-%d  %H:%M "

# window list
set -g window-status-format \
  "#[bg=#f2f0ee,fg=#51453d] #{b:pane_current_path}  #I #W#F "

set -g window-status-current-format \
  "#[bg=#51453d,fg=#f2f0ee]#[bg=#51453d,fg=#f9f8f6,bold] #{b:pane_current_path} #[bg=#eeecea,fg=#51453d]#[bg=#eeecea,fg=#1b1510,bold] #I #W#F #[bg=#f2f0ee,fg=#eeecea]"

set -g window-status-activity-style  "bg=#f2f0ee,fg=#7b5a0f"
set -g window-status-bell-style      "bg=#f2f0ee,fg=#992e29"

# pane borders
set -g pane-border-style             "fg=#c6b9a9"
set -g pane-active-border-style      "fg=#7b5a0f"

# message / command prompt
set -g message-style                 "bg=#eeecea,fg=#1b1510"
set -g message-command-style         "bg=#eeecea,fg=#51453d"

# copy mode
set -g mode-style                    "bg=#dacfbe,fg=#1b1510"
