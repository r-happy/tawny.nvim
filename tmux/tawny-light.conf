# tawny light theme for tmux (includes status bar layout)
# For colors only, source tmux/tawny-light-colors.conf instead.
# generated from lua/tawny/palette.lua by scripts/generate_companion_themes.lua
# https://github.com/r-happy/tawny.nvim

# status bar base
set -g status-style                  "bg=#f0f0f0,fg=#51453d"
set -g status-left-length            50
set -g status-right-length           80

# status-left: [session name]
set -g status-left \
  "#[bg=#cccccc,fg=#2a221d,bold] #S #[bg=#f0f0f0,fg=#51453d,nobold] "

# status-right: [host] [date time]
set -g status-right \
  "#[bg=#cccccc,fg=#2a221d] #h #[bg=#51453d,fg=#fafafa] %Y-%m-%d  %H:%M "

# window list
set -g window-status-format \
  "#[bg=#f0f0f0,fg=#51453d] #{b:pane_current_path}  #I #W#F "

set -g window-status-current-format \
  "#[bg=#51453d,fg=#f0f0f0]#[bg=#51453d,fg=#fafafa,bold] #{b:pane_current_path} #[bg=#ececec,fg=#51453d]#[bg=#ececec,fg=#2a221d,bold] #I #W#F #[bg=#f0f0f0,fg=#ececec]"

set -g window-status-activity-style  "bg=#f0f0f0,fg=#7b5a0f"
set -g window-status-bell-style      "bg=#f0f0f0,fg=#992e29"

# pane borders
set -g pane-border-style             "fg=#b8b8b8"
set -g pane-active-border-style      "fg=#7b5a0f"

# message / command prompt
set -g message-style                 "bg=#ececec,fg=#2a221d"
set -g message-command-style         "bg=#ececec,fg=#51453d"

# copy mode
set -g mode-style                    "bg=#cccccc,fg=#2a221d"
