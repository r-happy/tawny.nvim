# tawny light colors for tmux; preserves status bar layout
# generated by scripts/generate_companion_themes.lua
set -g status-style "bg=#f0f0f0,fg=#2a221d"
set -g window-status-style "bg=#f0f0f0,fg=#51453d"
set -g window-status-current-style "bg=#cccccc,fg=#7b5a0f,bold"
set -g window-status-activity-style "bg=#f0f0f0,fg=#7b5a0f"
set -g window-status-bell-style "bg=#f0f0f0,fg=#992e29"
set -g pane-border-style "fg=#b8b8b8"
set -g pane-active-border-style "fg=#7b5a0f"
set -g message-style "bg=#ececec,fg=#2a221d"
set -g message-command-style "bg=#ececec,fg=#2a221d"
set -g mode-style "bg=#cccccc,fg=#2a221d"
