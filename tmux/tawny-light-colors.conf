# tawny light colors for tmux; preserves status bar layout
# generated by scripts/generate_companion_themes.lua
set -g status-style "bg=#f2f0ee,fg=#1b1510"
set -g window-status-style "bg=#f2f0ee,fg=#51453d"
set -g window-status-current-style "bg=#dacfbe,fg=#7b5a0f,bold"
set -g window-status-activity-style "bg=#f2f0ee,fg=#7b5a0f"
set -g window-status-bell-style "bg=#f2f0ee,fg=#992e29"
set -g pane-border-style "fg=#c6b9a9"
set -g pane-active-border-style "fg=#7b5a0f"
set -g message-style "bg=#eeecea,fg=#1b1510"
set -g message-command-style "bg=#eeecea,fg=#1b1510"
set -g mode-style "bg=#dacfbe,fg=#1b1510"
