# tawny light colors for tmux; preserves status bar layout
# generated by scripts/generate_companion_themes.lua
set -g status-style "bg=#f3f1ec,fg=#2a221d"
set -g window-status-style "bg=#f3f1ec,fg=#51453d"
set -g window-status-current-style "bg=#e9e3d8,fg=#7b5a0f,bold"
set -g window-status-activity-style "bg=#f3f1ec,fg=#7b5a0f"
set -g window-status-bell-style "bg=#f3f1ec,fg=#992e29"
set -g pane-border-style "fg=#c0baaf"
set -g pane-active-border-style "fg=#7b5a0f"
set -g message-style "bg=#f0ede7,fg=#2a221d"
set -g message-command-style "bg=#f0ede7,fg=#2a221d"
set -g mode-style "bg=#e9e3d8,fg=#2a221d"
