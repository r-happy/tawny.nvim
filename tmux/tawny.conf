# tawny dark theme for tmux
# generated from lua/tawny/palette.lua by scripts/generate_companion_themes.lua
# https://github.com/r-happy/tawny.nvim

# status bar base
set -g status-style                  "bg=#222220,fg=#90867a"
set -g status-left-length            50
set -g status-right-length           80

# status-left: [session name]
set -g status-left \
  "#[bg=#403f3a,fg=#d5cfc3,bold] #S #[bg=#222220,fg=#90867a,nobold] "

# status-right: [host] [date time]
set -g status-right \
  "#[bg=#403f3a,fg=#222220]#[bg=#403f3a,fg=#90867a] #h #[bg=#90867a,fg=#403f3a]#[bg=#90867a,fg=#292826] %Y-%m-%d  %H:%M "

# window list
set -g window-status-format \
  "#[bg=#222220,fg=#90867a] #{b:pane_current_path}  #I #W#F "

set -g window-status-current-format \
  "#[bg=#90867a,fg=#222220]#[bg=#90867a,fg=#292826,bold] #{b:pane_current_path} #[bg=#3b3a35,fg=#90867a]#[bg=#3b3a35,fg=#d5cfc3,bold] #I #W#F #[bg=#222220,fg=#3b3a35]"

set -g window-status-activity-style  "bg=#222220,fg=#e0ca7b"
set -g window-status-bell-style      "bg=#222220,fg=#d87d91"

# pane borders
set -g pane-border-style             "fg=#484741"
set -g pane-active-border-style      "fg=#68645a"

# message / command prompt
set -g message-style                 "bg=#3b3a35,fg=#d5cfc3"
set -g message-command-style         "bg=#3b3a35,fg=#90867a"

# copy mode
set -g mode-style                    "bg=#403f3a,fg=#d5cfc3"
