# tawny dark theme for tmux
# generated from lua/tawny/palette.lua by scripts/generate_companion_themes.lua
# https://github.com/r-happy/tawny.nvim

# status bar base
set -g status-style                  "bg=#1f1f1f,fg=#90867a"
set -g status-left-length            50
set -g status-right-length           80

# status-left: [session name]
set -g status-left \
  "#[bg=#383838,fg=#d5cfc3,bold] #S #[bg=#1f1f1f,fg=#90867a,nobold] "

# status-right: [host] [date time]
set -g status-right \
  "#[bg=#383838,fg=#1f1f1f]#[bg=#383838,fg=#90867a] #h #[bg=#90867a,fg=#383838]#[bg=#90867a,fg=#242424] %Y-%m-%d  %H:%M "

# window list
set -g window-status-format \
  "#[bg=#1f1f1f,fg=#90867a] #{b:pane_current_path}  #I #W#F "

set -g window-status-current-format \
  "#[bg=#90867a,fg=#1f1f1f]#[bg=#90867a,fg=#242424,bold] #{b:pane_current_path} #[bg=#343434,fg=#90867a]#[bg=#343434,fg=#d5cfc3,bold] #I #W#F #[bg=#1f1f1f,fg=#343434]"

set -g window-status-activity-style  "bg=#1f1f1f,fg=#e0ca7b"
set -g window-status-bell-style      "bg=#1f1f1f,fg=#d87d91"

# pane borders
set -g pane-border-style             "fg=#404040"
set -g pane-active-border-style      "fg=#5c5c5c"

# message / command prompt
set -g message-style                 "bg=#343434,fg=#d5cfc3"
set -g message-command-style         "bg=#343434,fg=#90867a"

# copy mode
set -g mode-style                    "bg=#383838,fg=#d5cfc3"
