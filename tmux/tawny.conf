# tawny dark theme for tmux (includes status bar layout)
# For colors only, source tmux/tawny-colors.conf instead.
# generated from lua/tawny/palette.lua by scripts/generate_companion_themes.lua
# https://github.com/r-happy/tawny.nvim

# status bar base: flat, text color only
set -g status-style                  "bg=#151312,fg=#90867a"
set -g status-left-length            50
set -g status-right-length           80

# status-left: [session name]
set -g status-left                   "#[fg=#d5b981,bold] #S #[fg=#90867a,nobold] "

# status-right: [host] [date time]
set -g status-right                  "#[fg=#90867a]#h  %Y-%m-%d %H:%M "

# window list
set -g window-status-separator       ""
set -g window-status-format          "#[fg=#90867a,nobold] #{b:pane_current_path} #I #W#F "
set -g window-status-current-format  "#[fg=#e2ded5,bold] #{b:pane_current_path} #I #W#F #[nobold]"

set -g window-status-activity-style  "bg=#151312,fg=#d5b981"
set -g window-status-bell-style      "bg=#151312,fg=#d87d91"

# pane borders
set -g pane-border-style             "fg=#3b3630"
set -g pane-active-border-style      "fg=#d5b981"

# message / command prompt
set -g message-style                 "bg=#2d2822,fg=#e2ded5"
set -g message-command-style         "bg=#2d2822,fg=#90867a"

# copy mode
set -g mode-style                    "bg=#4d4233,fg=#e2ded5"
