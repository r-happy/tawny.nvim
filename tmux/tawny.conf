# tawny dark theme for tmux
# generated from lua/tawny/palette.lua by scripts/generate_companion_themes.lua
# https://github.com/r-happy/tawny.nvim

# status bar base
set -g status-style                  "bg=#1c1c1c,fg=#90867a"
set -g status-left-length            50
set -g status-right-length           80

# status-left: [session name]
set -g status-left \
  "#[bg=#323232,fg=#d5cfc3,bold] #S #[bg=#1c1c1c,fg=#90867a,nobold] "

# status-right: [host] [date time]
set -g status-right \
  "#[bg=#323232,fg=#1c1c1c]#[bg=#323232,fg=#90867a] #h #[bg=#90867a,fg=#323232]#[bg=#90867a,fg=#212121] %Y-%m-%d  %H:%M "

# window list
set -g window-status-format \
  "#[bg=#1c1c1c,fg=#90867a] #{b:pane_current_path}  #I #W#F "

set -g window-status-current-format \
  "#[bg=#90867a,fg=#1c1c1c]#[bg=#90867a,fg=#212121,bold] #{b:pane_current_path} #[bg=#2f2f2f,fg=#90867a]#[bg=#2f2f2f,fg=#d5cfc3,bold] #I #W#F #[bg=#1c1c1c,fg=#2f2f2f]"

set -g window-status-activity-style  "bg=#1c1c1c,fg=#e0ca7b"
set -g window-status-bell-style      "bg=#1c1c1c,fg=#d87d91"

# pane borders
set -g pane-border-style             "fg=#383838"
set -g pane-active-border-style      "fg=#525252"

# message / command prompt
set -g message-style                 "bg=#2f2f2f,fg=#d5cfc3"
set -g message-command-style         "bg=#2f2f2f,fg=#90867a"

# copy mode
set -g mode-style                    "bg=#323232,fg=#d5cfc3"
