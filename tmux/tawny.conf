# tawny dark theme for tmux
# generated from lua/tawny/palette.lua by scripts/generate_companion_themes.lua
# https://github.com/r-happy/tawny.nvim

# status bar base
set -g status-style                  "bg=#0b0a09,fg=#81756a"
set -g status-left-length            50
set -g status-right-length           80

# status-left: [session name]
set -g status-left \
  "#[bg=#332d29,fg=#d8c9b6,bold] #S #[bg=#0b0a09,fg=#81756a,nobold] "

# status-right: [host] [date time]
set -g status-right \
  "#[bg=#332d29,fg=#0b0a09]#[bg=#332d29,fg=#81756a] #h #[bg=#81756a,fg=#332d29]#[bg=#81756a,fg=#0f0e0d] %Y-%m-%d  %H:%M "

# window list
set -g window-status-format \
  "#[bg=#0b0a09,fg=#81756a] #{b:pane_current_path}  #I #W#F "

set -g window-status-current-format \
  "#[bg=#81756a,fg=#0b0a09]#[bg=#81756a,fg=#0f0e0d,bold] #{b:pane_current_path} #[bg=#201d1b,fg=#81756a]#[bg=#201d1b,fg=#d8c9b6,bold] #I #W#F #[bg=#0b0a09,fg=#201d1b]"

set -g window-status-activity-style  "bg=#0b0a09,fg=#d7b875"
set -g window-status-bell-style      "bg=#0b0a09,fg=#d2707d"

# pane borders
set -g pane-border-style             "fg=#3b3430"
set -g pane-active-border-style      "fg=#65574e"

# message / command prompt
set -g message-style                 "bg=#201d1b,fg=#d8c9b6"
set -g message-command-style         "bg=#201d1b,fg=#81756a"

# copy mode
set -g mode-style                    "bg=#332d29,fg=#d8c9b6"
