# tawny dark theme for tmux
# generated from lua/tawny/palette.lua by scripts/generate_companion_themes.lua
# https://github.com/r-happy/tawny.nvim

# status bar base
set -g status-style                  "bg=#22231f,fg=#8d8c7c"
set -g status-left-length            50
set -g status-right-length           80

# status-left: [session name]
set -g status-left \
  "#[bg=#404238,fg=#d5cfc3,bold] #S #[bg=#22231f,fg=#8d8c7c,nobold] "

# status-right: [host] [date time]
set -g status-right \
  "#[bg=#404238,fg=#22231f]#[bg=#404238,fg=#8d8c7c] #h #[bg=#8d8c7c,fg=#404238]#[bg=#8d8c7c,fg=#292a25] %Y-%m-%d  %H:%M "

# window list
set -g window-status-format \
  "#[bg=#22231f,fg=#8d8c7c] #{b:pane_current_path}  #I #W#F "

set -g window-status-current-format \
  "#[bg=#8d8c7c,fg=#22231f]#[bg=#8d8c7c,fg=#292a25,bold] #{b:pane_current_path} #[bg=#3a3c34,fg=#8d8c7c]#[bg=#3a3c34,fg=#d5cfc3,bold] #I #W#F #[bg=#22231f,fg=#3a3c34]"

set -g window-status-activity-style  "bg=#22231f,fg=#e0ca7b"
set -g window-status-bell-style      "bg=#22231f,fg=#d87d91"

# pane borders
set -g pane-border-style             "fg=#484a40"
set -g pane-active-border-style      "fg=#676959"

# message / command prompt
set -g message-style                 "bg=#3a3c34,fg=#d5cfc3"
set -g message-command-style         "bg=#3a3c34,fg=#8d8c7c"

# copy mode
set -g mode-style                    "bg=#404238,fg=#d5cfc3"
