# tawny dark theme for tmux
# generated from lua/tawny/palette.lua by scripts/generate_companion_themes.lua
# https://github.com/r-happy/tawny.nvim

# status bar base
set -g status-style                  "bg=#181818,fg=#90867a"
set -g status-left-length            50
set -g status-right-length           80

# status-left: [session name]
set -g status-left \
  "#[bg=#2e2e2e,fg=#d5cfc3,bold] #S #[bg=#181818,fg=#90867a,nobold] "

# status-right: [host] [date time]
set -g status-right \
  "#[bg=#2e2e2e,fg=#181818]#[bg=#2e2e2e,fg=#90867a] #h #[bg=#90867a,fg=#2e2e2e]#[bg=#90867a,fg=#1c1c1c] %Y-%m-%d  %H:%M "

# window list
set -g window-status-format \
  "#[bg=#181818,fg=#90867a] #{b:pane_current_path}  #I #W#F "

set -g window-status-current-format \
  "#[bg=#90867a,fg=#181818]#[bg=#90867a,fg=#1c1c1c,bold] #{b:pane_current_path} #[bg=#2b2b2b,fg=#90867a]#[bg=#2b2b2b,fg=#d5cfc3,bold] #I #W#F #[bg=#181818,fg=#2b2b2b]"

set -g window-status-activity-style  "bg=#181818,fg=#e0ca7b"
set -g window-status-bell-style      "bg=#181818,fg=#d87d91"

# pane borders
set -g pane-border-style             "fg=#333333"
set -g pane-active-border-style      "fg=#4d4d4d"

# message / command prompt
set -g message-style                 "bg=#2b2b2b,fg=#d5cfc3"
set -g message-command-style         "bg=#2b2b2b,fg=#90867a"

# copy mode
set -g mode-style                    "bg=#2e2e2e,fg=#d5cfc3"
