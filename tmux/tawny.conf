# tawny dark theme for tmux (includes status bar layout)
# For colors only, source tmux/tawny-colors.conf instead.
# generated from lua/tawny/palette.lua by scripts/generate_companion_themes.lua
# https://github.com/r-happy/tawny.nvim

# status bar base
set -g status-style                  "bg=#161513,fg=#90867a"
set -g status-left-length            50
set -g status-right-length           80

# status-left: [session name]
set -g status-left \
  "#[bg=#423a2e,fg=#e2ded5,bold] #S #[bg=#161513,fg=#90867a,nobold] "

# status-right: [host] [date time]
set -g status-right \
  "#[bg=#423a2e,fg=#e2ded5] #h #[bg=#90867a,fg=#1a1816] %Y-%m-%d  %H:%M "

# window list
set -g window-status-format \
  "#[bg=#161513,fg=#90867a] #{b:pane_current_path}  #I #W#F "

set -g window-status-current-format \
  "#[bg=#90867a,fg=#161513]#[bg=#90867a,fg=#1a1816,bold] #{b:pane_current_path} #[bg=#2d2822,fg=#90867a]#[bg=#2d2822,fg=#e2ded5,bold] #I #W#F #[bg=#161513,fg=#2d2822]"

set -g window-status-activity-style  "bg=#161513,fg=#e0ca7b"
set -g window-status-bell-style      "bg=#161513,fg=#d87d91"

# pane borders
set -g pane-border-style             "fg=#322f29"
set -g pane-active-border-style      "fg=#e0ca7b"

# message / command prompt
set -g message-style                 "bg=#2d2822,fg=#e2ded5"
set -g message-command-style         "bg=#2d2822,fg=#90867a"

# copy mode
set -g mode-style                    "bg=#423a2e,fg=#e2ded5"
