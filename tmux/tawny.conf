# tawny dark theme for tmux
# https://github.com/r-happy/tawny.nvim

# status bar base
set -g status-style                  "bg=#0a0807,fg=#927963"
set -g status-left-length            50
set -g status-right-length           80

# status-left: [session name]
set -g status-left \
  "#[bg=#342a24,fg=#f1d8b8,bold] #S #[bg=#0a0807,fg=#927963,nobold] "

# status-right: [host] [date time]
set -g status-right \
  "#[bg=#342a24,fg=#0a0807]#[bg=#342a24,fg=#927963] #h #[bg=#927963,fg=#342a24]#[bg=#927963,fg=#110d0c] %Y-%m-%d  %H:%M "

# window list
set -g window-status-format \
  "#[bg=#0a0807,fg=#927963] #{b:pane_current_path}  #I #W#F "

set -g window-status-current-format \
  "#[bg=#927963,fg=#0a0807]#[bg=#927963,fg=#110d0c,bold] #{b:pane_current_path} #[bg=#221c19,fg=#927963]#[bg=#221c19,fg=#f1d8b8,bold] #I #W#F #[bg=#0a0807,fg=#221c19]"

set -g window-status-activity-style  "bg=#0a0807,fg=#f4c96b"
set -g window-status-bell-style      "bg=#0a0807,fg=#e26d7d"

# pane borders
set -g pane-border-style             "fg=#342a24"
set -g pane-active-border-style      "fg=#927963"

# message / command prompt
set -g message-style                 "bg=#221c19,fg=#f1d8b8"
set -g message-command-style         "bg=#221c19,fg=#927963"

# copy mode
set -g mode-style                    "bg=#221c19,fg=#f1d8b8"
