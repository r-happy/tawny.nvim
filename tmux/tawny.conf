# tawny dark theme for tmux
# generated from lua/tawny/palette.lua by scripts/generate_companion_themes.lua
# https://github.com/r-happy/tawny.nvim

# status bar base
set -g status-style                  "bg=#1d1a19,fg=#796f67"
set -g status-left-length            50
set -g status-right-length           80

# status-left: [session name]
set -g status-left \
  "#[bg=#3f2f24,fg=#cbbba9,bold] #S #[bg=#1d1a19,fg=#796f67,nobold] "

# status-right: [host] [date time]
set -g status-right \
  "#[bg=#3f2f24,fg=#1d1a19]#[bg=#3f2f24,fg=#796f67] #h #[bg=#796f67,fg=#3f2f24]#[bg=#796f67,fg=#221f1d] %Y-%m-%d  %H:%M "

# window list
set -g window-status-format \
  "#[bg=#1d1a19,fg=#796f67] #{b:pane_current_path}  #I #W#F "

set -g window-status-current-format \
  "#[bg=#796f67,fg=#1d1a19]#[bg=#796f67,fg=#221f1d,bold] #{b:pane_current_path} #[bg=#342e2a,fg=#796f67]#[bg=#342e2a,fg=#cbbba9,bold] #I #W#F #[bg=#1d1a19,fg=#342e2a]"

set -g window-status-activity-style  "bg=#1d1a19,fg=#d8b66d"
set -g window-status-bell-style      "bg=#1d1a19,fg=#d56e78"

# pane borders
set -g pane-border-style             "fg=#46372d"
set -g pane-active-border-style      "fg=#755e4f"

# message / command prompt
set -g message-style                 "bg=#342e2a,fg=#cbbba9"
set -g message-command-style         "bg=#342e2a,fg=#796f67"

# copy mode
set -g mode-style                    "bg=#3f2f24,fg=#cbbba9"
