# tawny dark theme for tmux (includes status bar layout)
# For colors only, source tmux/tawny-colors.conf instead.
# generated from lua/tawny/palette.lua by scripts/generate_companion_themes.lua
# https://github.com/r-happy/tawny.nvim

# status bar base
set -g status-style                  "bg=#141414,fg=#90867a"
set -g status-left-length            50
set -g status-right-length           80

# status-left: [session name]
set -g status-left \
  "#[bg=#3b3b3b,fg=#d5cfc3,bold] #S #[bg=#141414,fg=#90867a,nobold] "

# status-right: [host] [date time]
set -g status-right \
  "#[bg=#3b3b3b,fg=#d5cfc3] #h #[bg=#90867a,fg=#181818] %Y-%m-%d  %H:%M "

# window list
set -g window-status-format \
  "#[bg=#141414,fg=#90867a] #{b:pane_current_path}  #I #W#F "

set -g window-status-current-format \
  "#[bg=#90867a,fg=#141414]#[bg=#90867a,fg=#181818,bold] #{b:pane_current_path} #[bg=#282828,fg=#90867a]#[bg=#282828,fg=#d5cfc3,bold] #I #W#F #[bg=#141414,fg=#282828]"

set -g window-status-activity-style  "bg=#141414,fg=#e0ca7b"
set -g window-status-bell-style      "bg=#141414,fg=#d87d91"

# pane borders
set -g pane-border-style             "fg=#2e2e2e"
set -g pane-active-border-style      "fg=#e0ca7b"

# message / command prompt
set -g message-style                 "bg=#282828,fg=#d5cfc3"
set -g message-command-style         "bg=#282828,fg=#90867a"

# copy mode
set -g mode-style                    "bg=#3b3b3b,fg=#d5cfc3"
