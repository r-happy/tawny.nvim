# tawny dark theme for tmux
# generated from lua/tawny/palette.lua by scripts/generate_companion_themes.lua
# https://github.com/r-happy/tawny.nvim

# status bar base
set -g status-style                  "bg=#201f1e,fg=#90867a"
set -g status-left-length            50
set -g status-right-length           80

# status-left: [session name]
set -g status-left \
  "#[bg=#393735,fg=#d5cfc3,bold] #S #[bg=#201f1e,fg=#90867a,nobold] "

# status-right: [host] [date time]
set -g status-right \
  "#[bg=#393735,fg=#201f1e]#[bg=#393735,fg=#90867a] #h #[bg=#90867a,fg=#393735]#[bg=#90867a,fg=#242322] %Y-%m-%d  %H:%M "

# window list
set -g window-status-format \
  "#[bg=#201f1e,fg=#90867a] #{b:pane_current_path}  #I #W#F "

set -g window-status-current-format \
  "#[bg=#90867a,fg=#201f1e]#[bg=#90867a,fg=#242322,bold] #{b:pane_current_path} #[bg=#363532,fg=#90867a]#[bg=#363532,fg=#d5cfc3,bold] #I #W#F #[bg=#201f1e,fg=#363532]"

set -g window-status-activity-style  "bg=#201f1e,fg=#e0ca7b"
set -g window-status-bell-style      "bg=#201f1e,fg=#d87d91"

# pane borders
set -g pane-border-style             "fg=#413f3c"
set -g pane-active-border-style      "fg=#5f5b54"

# message / command prompt
set -g message-style                 "bg=#363532,fg=#d5cfc3"
set -g message-command-style         "bg=#363532,fg=#90867a"

# copy mode
set -g mode-style                    "bg=#393735,fg=#d5cfc3"
