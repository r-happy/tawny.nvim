# tawny dark theme for tmux
# generated from lua/tawny/palette.lua by scripts/generate_companion_themes.lua
# https://github.com/r-happy/tawny.nvim

# status bar base
set -g status-style                  "bg=#222120,fg=#90857a"
set -g status-left-length            50
set -g status-right-length           80

# status-left: [session name]
set -g status-left \
  "#[bg=#403d3a,fg=#d5cec3,bold] #S #[bg=#222120,fg=#90857a,nobold] "

# status-right: [host] [date time]
set -g status-right \
  "#[bg=#403d3a,fg=#222120]#[bg=#403d3a,fg=#90857a] #h #[bg=#90857a,fg=#403d3a]#[bg=#90857a,fg=#292826] %Y-%m-%d  %H:%M "

# window list
set -g window-status-format \
  "#[bg=#222120,fg=#90857a] #{b:pane_current_path}  #I #W#F "

set -g window-status-current-format \
  "#[bg=#90857a,fg=#222120]#[bg=#90857a,fg=#292826,bold] #{b:pane_current_path} #[bg=#3b3835,fg=#90857a]#[bg=#3b3835,fg=#d5cec3,bold] #I #W#F #[bg=#222120,fg=#3b3835]"

set -g window-status-activity-style  "bg=#222120,fg=#dcbb7a"
set -g window-status-bell-style      "bg=#222120,fg=#d47d87"

# pane borders
set -g pane-border-style             "fg=#494541"
set -g pane-active-border-style      "fg=#68615a"

# message / command prompt
set -g message-style                 "bg=#3b3835,fg=#d5cec3"
set -g message-command-style         "bg=#3b3835,fg=#90857a"

# copy mode
set -g mode-style                    "bg=#403d3a,fg=#d5cec3"
