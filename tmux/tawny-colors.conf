# tawny dark colors for tmux; preserves status bar layout
# generated by scripts/generate_companion_themes.lua
set -g status-style "bg=#161513,fg=#e2ded5"
set -g window-status-style "bg=#161513,fg=#90867a"
set -g window-status-current-style "bg=#4d4233,fg=#d5b981,bold"
set -g window-status-activity-style "bg=#161513,fg=#d5b981"
set -g window-status-bell-style "bg=#161513,fg=#d87d91"
set -g pane-border-style "fg=#3b3630"
set -g pane-active-border-style "fg=#d5b981"
set -g message-style "bg=#2d2822,fg=#e2ded5"
set -g message-command-style "bg=#2d2822,fg=#e2ded5"
set -g mode-style "bg=#4d4233,fg=#e2ded5"
