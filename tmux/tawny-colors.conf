# tawny dark colors for tmux; preserves status bar layout
# generated by scripts/generate_companion_themes.lua
set -g status-style "bg=#141414,fg=#e2ded5"
set -g window-status-style "bg=#141414,fg=#90867a"
set -g window-status-current-style "bg=#3b3b3b,fg=#e0ca7b,bold"
set -g window-status-activity-style "bg=#141414,fg=#e0ca7b"
set -g window-status-bell-style "bg=#141414,fg=#d87d91"
set -g pane-border-style "fg=#2e2e2e"
set -g pane-active-border-style "fg=#e0ca7b"
set -g message-style "bg=#282828,fg=#e2ded5"
set -g message-command-style "bg=#282828,fg=#e2ded5"
set -g mode-style "bg=#3b3b3b,fg=#e2ded5"
