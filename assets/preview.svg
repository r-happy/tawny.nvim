<text x="324" y="259" fill="#e2ded5" font-size="16"> .. </text>
<text x="364" y="259" fill="#e2ded5" font-size="16">name</text>
<text x="25" y="286" fill="#90867a" font-size="15">6</text>
<text x="54" y="286" fill="#d39b69" font-size="16">  return </text>
<text x="144" y="286" fill="#e2ded5" font-size="16">message</text>
<text x="25" y="313" fill="#90867a" font-size="15">7</text>
<text x="54" y="313" fill="#d39b69" font-size="16">end</text>
<text x="25" y="340" fill="#90867a" font-size="15">8</text>
<text x="25" y="367" fill="#90867a" font-size="15">9</text>
<text x="54" y="367" fill="#8ea8c2" font-size="16">greet</text>
<text x="104" y="367" fill="#e2ded5" font-size="16">(</text>
<text x="114" y="367" fill="#d4ad77" font-size="16">"Tawny"</text>
<text x="184" y="367" fill="#e2ded5" font-size="16">)</text>
<text x="24" y="423" fill="#d87d91" font-size="14">● error</text>
<text x="144" y="423" fill="#d39b69" font-size="14">● warning</text>
<text x="284" y="423" fill="#8ea8c2" font-size="14">● info</text>
<text x="404" y="423" fill="#86b6aa" font-size="14">● hint</text>
<text x="24" y="464" fill="#9c968b" font-size="13">Row 5: cursor line   Row 6: selection</text>
</g>
