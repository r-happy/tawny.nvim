<text x="294" y="178" fill="#d4ad77" font-size="16">"catalog"</text>
<text x="384" y="178" fill="#e2ded5" font-size="16">)</text>
<text x="25" y="205" fill="#90867a" font-size="15">3</text>
<text x="25" y="232" fill="#90867a" font-size="15">4</text>
