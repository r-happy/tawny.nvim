<rect x="74" y="274" width="164" height="27" fill="#423a2e"/>
<text x="25" y="151" fill="#90867a" font-size="15">1</text>
<text x="54" y="151" fill="#9c968b" font-size="16">-- Warm colors, readable structure</text>
